name: CI

on:
  pull_request:
  merge_group: # the GitHub merge queue runs the checks on the merged result (docs/23-PARALLEL-WORK.md)
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:test
      - run: pnpm build

  # Browser tests (issue #472 review: they ran nowhere, so three of them were already red when the Changes report merged). A separate job, so the fast
  # `check` above stays quick and is the one to require; add "e2e" to the required checks of the main branch (Settings, Rules) to make it block merges.
  e2e:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Build with the in-memory test pages on
        run: pnpm --filter web exec next build
        env:
          NEXT_PUBLIC_E2E_HARNESS: "1"
      - run: pnpm --filter web exec playwright test --trace off --reporter=list
