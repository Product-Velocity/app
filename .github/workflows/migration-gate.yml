name: Migration gate

# A PR that adds a database migration must say it is applied to production before it can merge (tools/check-pr-migrations.mjs).
# Separate from ci.yml so that editing the PR description re-runs only this check, not the whole suite.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group: # keeps the check reportable when it is a required status in the merge queue

permissions:
  contents: read

jobs:
  migration-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Merge queue: the PR already passed this check
        if: github.event_name == 'merge_group'
        run: echo "Checked on the pull request."
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Check migrations against the PR description
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ADDED_FILES="$(git diff --name-only --diff-filter=A "$BASE_SHA"..."$HEAD_SHA" -- packages/db/migrations)"
          export ADDED_FILES
          node tools/check-pr-migrations.mjs
